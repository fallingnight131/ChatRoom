syntax = "proto3";

package chat.v2;

option java_multiple_files = true;
option java_package = "com.fallingnight.chat.protocol.v2";
option java_outer_classname = "ControlSchema";

// Values are permanent registry identities. Removed values must be reserved.
enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_CLIENT_HELLO = 1;
  MESSAGE_TYPE_SERVER_HELLO = 2;
  MESSAGE_TYPE_PROTOCOL_ERROR = 3;
  MESSAGE_TYPE_AUTHENTICATE = 10;
  MESSAGE_TYPE_RESUME_SESSION = 11;
  MESSAGE_TYPE_SESSION_ESTABLISHED = 12;
  MESSAGE_TYPE_AUTHENTICATION_REJECTED = 13;
  MESSAGE_TYPE_SUBMIT_MESSAGE = 100;
  MESSAGE_TYPE_MESSAGE_ACCEPTED = 101;
  MESSAGE_TYPE_READ_MESSAGE_HISTORY = 102;
  MESSAGE_TYPE_MESSAGE_HISTORY_PAGE = 103;
  MESSAGE_TYPE_MESSAGE_PUBLISHED = 104;
  MESSAGE_TYPE_SUBMIT_REPLY_MESSAGE = 105;
  MESSAGE_TYPE_SET_MESSAGE_REACTION = 106;
  MESSAGE_TYPE_MESSAGE_REACTION_APPLIED = 107;
  MESSAGE_TYPE_MESSAGE_REACTION_CHANGED = 108;
  MESSAGE_TYPE_LIST_CONVERSATIONS = 110;
  MESSAGE_TYPE_CONVERSATION_DIRECTORY_PAGE = 111;
  MESSAGE_TYPE_REGISTER_ATTACHMENT = 120;
  MESSAGE_TYPE_ATTACHMENT_REGISTERED = 121;
  MESSAGE_TYPE_AUTHORIZE_ATTACHMENT_UPLOAD = 122;
  MESSAGE_TYPE_ATTACHMENT_UPLOAD_AUTHORIZED = 123;
  MESSAGE_TYPE_COMPLETE_ATTACHMENT_UPLOAD = 124;
  MESSAGE_TYPE_ATTACHMENT_READY = 125;
  MESSAGE_TYPE_LIST_DEVICES = 130;
  MESSAGE_TYPE_DEVICE_DIRECTORY = 131;
  MESSAGE_TYPE_REVOKE_DEVICE = 132;
  MESSAGE_TYPE_DEVICE_REVOKED = 133;
}

enum ClientPlatform {
  CLIENT_PLATFORM_UNSPECIFIED = 0;
  CLIENT_PLATFORM_WEB = 1;
  CLIENT_PLATFORM_WINDOWS = 2;
}

enum ClientCapability {
  CLIENT_CAPABILITY_UNSPECIFIED = 0;
  CLIENT_CAPABILITY_MESSAGE_REACTIONS = 1;
}

message ClientHello {
  uint32 minimum_protocol_version = 1;
  uint32 maximum_protocol_version = 2;
  ClientPlatform platform = 3;
  string app_version = 4;
  string client_device_id = 5;
  repeated ClientCapability capabilities = 6;
}

message ServerHello {
  uint32 selected_protocol_version = 1;
  string connection_id = 2;
  int64 server_time_epoch_ms = 3;
  uint32 maximum_frame_bytes = 4;
  repeated ClientCapability enabled_capabilities = 5;
}

enum ProtocolErrorCode {
  PROTOCOL_ERROR_CODE_UNSPECIFIED = 0;
  PROTOCOL_ERROR_CODE_UNSUPPORTED_VERSION = 1;
  PROTOCOL_ERROR_CODE_UNSUPPORTED_MESSAGE_TYPE = 2;
  PROTOCOL_ERROR_CODE_INVALID_PAYLOAD = 3;
  PROTOCOL_ERROR_CODE_INVALID_STATE = 4;
  PROTOCOL_ERROR_CODE_RATE_LIMITED = 5;
  PROTOCOL_ERROR_CODE_INTERNAL_ERROR = 6;
  PROTOCOL_ERROR_CODE_IDEMPOTENCY_CONFLICT = 7;
  PROTOCOL_ERROR_CODE_NOT_AUTHORIZED = 8;
}

message ProtocolError {
  ProtocolErrorCode code = 1;
  string safe_message = 2;
  bool retryable = 3;
}
