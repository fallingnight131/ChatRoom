syntax = "proto3";

package chat.v2;

option java_multiple_files = true;
option java_package = "com.fallingnight.chat.protocol.v2";
option java_outer_classname = "MessagingSchema";

enum MessageContentType {
  MESSAGE_CONTENT_TYPE_UNSPECIFIED = 0;
  MESSAGE_CONTENT_TYPE_TEXT_UTF8 = 1;
}

message SubmitMessage {
  string conversation_id = 1;
  uint32 content_type = 2;
  bytes content = 3;
}

message MessageAccepted {
  string conversation_id = 1;
  string message_id = 2;
  uint64 conversation_sequence = 3;
  int64 accepted_at_epoch_ms = 4;
  bool duplicate = 5;
}

message ReadMessageHistory {
  string conversation_id = 1;
  uint64 after_sequence = 2;
  uint32 limit = 3;
}

message MessageRecord {
  string conversation_id = 1;
  string message_id = 2;
  uint64 conversation_sequence = 3;
  string sender_account_id = 4;
  string sender_device_id = 5;
  string client_message_id = 6;
  uint32 content_type = 7;
  bytes content = 8;
  int64 accepted_at_epoch_ms = 9;
}

message MessageHistoryPage {
  string conversation_id = 1;
  repeated MessageRecord messages = 2;
  uint64 next_sequence = 3;
  uint64 latest_sequence = 4;
  bool has_more = 5;
}
