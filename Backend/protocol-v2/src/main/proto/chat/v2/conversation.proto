syntax = "proto3";

package chat.v2;

option java_multiple_files = true;
option java_package = "com.fallingnight.chat.protocol.v2";
option java_outer_classname = "ConversationSchema";

enum ConversationKind {
  CONVERSATION_KIND_UNSPECIFIED = 0;
  CONVERSATION_KIND_DIRECT = 1;
  CONVERSATION_KIND_GROUP = 2;
}

enum ConversationRole {
  CONVERSATION_ROLE_UNSPECIFIED = 0;
  CONVERSATION_ROLE_OWNER = 1;
  CONVERSATION_ROLE_ADMIN = 2;
  CONVERSATION_ROLE_MEMBER = 3;
}

message ListConversations {
  int64 after_updated_at_epoch_ms = 1;
  string after_conversation_id = 2;
  uint32 limit = 3;
}

message ConversationDirectoryRecord {
  string conversation_id = 1;
  ConversationKind kind = 2;
  string display_name = 3;
  ConversationRole role = 4;
  uint64 latest_sequence = 5;
  uint64 last_read_sequence = 6;
  int64 updated_at_epoch_ms = 7;
}

message ConversationDirectoryPage {
  repeated ConversationDirectoryRecord conversations = 1;
  int64 next_updated_at_epoch_ms = 2;
  string next_conversation_id = 3;
  bool has_more = 4;
}

message ListConversationParticipants {
  string conversation_id = 1;
  string after_account_id = 2;
  uint32 limit = 3;
}

message ConversationParticipantRecord {
  string account_id = 1;
  string display_name = 2;
  ConversationRole role = 3;
}

message ConversationParticipantPage {
  string conversation_id = 1;
  repeated ConversationParticipantRecord participants = 2;
  string next_account_id = 3;
  bool has_more = 4;
}
