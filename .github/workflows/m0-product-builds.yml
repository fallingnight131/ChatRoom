name: Windows Product and Qt Portability Builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: "6.11.1"
  NSIS_VERSION: "3.12.0"

jobs:
  linux-release:
    name: Linux Qt portability build (non-product)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Qt portability build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes qt6-base-dev qt6-multimedia-dev qt6-websockets-dev libsodium-dev pkg-config

      - name: Build Qt sources in Release mode for portability
        run: python3 tools/verify_m0.py --qt

  macos-release:
    name: macOS development build (non-product)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pinned Qt SDK
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia qtwebsockets
          cache: true

      - name: Install server password hashing dependency
        run: brew install libsodium

      - name: Build Qt sources for macOS development feedback
        run: python3 tools/verify_m0.py --qt

      - name: Assemble unsigned macOS development artifact
        run: |
          set -euo pipefail
          app_path="$(find build/m0/darwin/client -name ChatClient.app -type d -print -quit)"
          server_path="$(find build/m0/darwin/server -name ChatServer -type f -perm -111 -print -quit)"
          test -n "$app_path"
          test -n "$server_path"
          macdeployqt "$app_path" -always-overwrite
          mkdir -p build/m0/artifacts/macos
          ditto "$app_path" build/m0/artifacts/macos/ChatClient.app
          cp "$server_path" build/m0/artifacts/macos/ChatServer
          sodium_lib="$(otool -L "$server_path" | awk '/libsodium.*dylib/ { print $1; exit }')"
          test -n "$sodium_lib"
          sodium_name="$(basename "$sodium_lib")"
          cp "$sodium_lib" "build/m0/artifacts/macos/$sodium_name"
          install_name_tool -change "$sodium_lib" "@executable_path/$sodium_name" build/m0/artifacts/macos/ChatServer
          shasum -a 256 build/m0/artifacts/macos/ChatServer > build/m0/artifacts/macos/SHA256SUMS

      - name: Upload non-product macOS development artifact
        uses: actions/upload-artifact@v7
        with:
          name: chat-room-macos-development-${{ env.QT_VERSION }}-${{ github.sha }}
          path: build/m0/artifacts/macos
          if-no-files-found: error
          retention-days: 14

  windows-release:
    name: Windows client payload verification
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Read canonical product version
        id: product-version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content VERSION -Raw).Trim()
          if (-not $version) { throw "VERSION is empty" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Test Windows artifact manifest policy
        run: |
          python Tests/windows_artifact_manifest_test.py
          python Tests/windows_installer_policy_test.py
          python Tests/windows_release_signature_policy_test.py
          python Tests/windows_cmake_product_target_test.py
          python Tests/windows_client_payload_parity_test.py
          python Tests/windows_cmake_installer_gate_test.py
          python Tests/windows_cmake_packaging_promotion_test.py
          python Tests/windows_cmake_update_configuration_test.py
          python Tests/windows_cmake_v2_configuration_test.py
          python Tests/windows_v2_product_composition_test.py
          python Tests/windows_update_trust_diagnostic_policy_test.py
          python Tests/windows_unsigned_artifact_verifier_test.py

      - name: Install pinned Qt SDK
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia qtwebsockets
          cache: true

      - name: Install server password hashing dependency
        shell: pwsh
        run: |
          vcpkg install --triplet x64-windows
          $sodiumRoot = "$env:GITHUB_WORKSPACE\vcpkg_installed\x64-windows" -replace '\\', '/'
          "SODIUM_ROOT=$sodiumRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Qt server and desktop client in Release mode
        run: python tools/verify_m0.py --qt

      - name: Build Windows CMake client targets in Release mode
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S . -B build/m4/windows-cmake -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCHATROOM_BUILD_HEADLESS_SERVER=ON `
            -DCHATROOM_BUILD_WINDOWS_CLIENT=ON `
            -DBUILD_TESTING=ON `
            "-DSODIUM_ROOT=$env:SODIUM_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Windows CMake configuration failed" }
          cmake --build build/m4/windows-cmake --config Release `
            --target ChatClient ChatRoomUpdateLauncher `
              WindowsV2ProductConfigurationEnabledTest --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Windows CMake client build failed" }
          & build/m4/windows-cmake/Release/WindowsV2ProductConfigurationEnabledTest.exe
          if ($LASTEXITCODE -ne 0) { throw "Enabled Windows V2 configuration test failed" }
          $cmakeClient = Get-Item build/m4/windows-cmake/Release/ChatClient.exe
          $cmakeLauncher = Get-Item build/m4/windows-cmake/Release/ChatRoomUpdateLauncher.exe
          $version = "${{ steps.product-version.outputs.version }}"
          if (-not $cmakeClient.VersionInfo.ProductVersion.StartsWith($version)) {
            throw "CMake client version does not match canonical VERSION"
          }
          if (-not $cmakeLauncher.VersionInfo.ProductVersion.StartsWith($version)) {
            throw "CMake update launcher version does not match canonical VERSION"
          }
          $trust = (& $cmakeClient.FullName --chatroom-print-update-trust-json) |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $trust.enabled -ne $false `
              -or $trust.trustedKeys.Count -ne 0) {
            throw "Ordinary Windows client did not retain default-off update trust"
          }
          $v2 = (& $cmakeClient.FullName --chatroom-print-v2-configuration-json) |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $v2.schemaVersion -ne 2 `
              -or $v2.enabled -ne $false -or $v2.messageForwardingEnabled -ne $false `
              -or $v2.endpoint -ne "" -or $v2.fallbackEndpoints.Count -ne 0) {
            throw "Ordinary Windows client did not retain default-off V2 configuration"
          }

      - name: Assemble qmake Windows fallback payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $client = Get-ChildItem build/m0/windows/client -Recurse -Filter ChatClient.exe | Select-Object -First 1
          $launcher = Get-ChildItem build/m0/windows/update-launcher -Recurse -Filter ChatRoomUpdateLauncher.exe | Select-Object -First 1
          $server = Get-ChildItem build/m0/windows/server -Recurse -Filter ChatServer.exe | Select-Object -First 1
          if (-not $client -or -not $launcher -or -not $server) { throw "Qt Release executables were not found" }

          $baseline = "build/m4/windows-qmake-payload"
          if (Test-Path $baseline) { Remove-Item $baseline -Recurse -Force }
          New-Item -ItemType Directory -Force $baseline | Out-Null
          Copy-Item $client.FullName "$baseline/ChatClient.exe"
          Copy-Item $launcher.FullName "$baseline/ChatRoomUpdateLauncher.exe"
          windeployqt --release --no-translations "$baseline/ChatClient.exe"
          $sodiumDll = Get-ChildItem "$env:SODIUM_ROOT/bin" -Filter "*sodium*.dll" | Select-Object -First 1
          if (-not $sodiumDll) { throw "Windows client artifact is missing the libsodium runtime source" }
          Copy-Item $sodiumDll.FullName "$baseline/$($sodiumDll.Name)"
          $sqlitePlugin = Get-ChildItem "$baseline/sqldrivers" -Filter "qsqlite.dll" -ErrorAction SilentlyContinue
          if (-not $sqlitePlugin) { throw "Windows client artifact is missing the Qt SQLite driver" }

      - name: Compare deployed CMake and qmake Windows payloads
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $baseline = (Resolve-Path "build/m4/windows-qmake-payload").Path
          $candidate = "$env:GITHUB_WORKSPACE/build/m4/windows-cmake-payload"
          if (Test-Path $candidate) { Remove-Item $candidate -Recurse -Force }
          New-Item -ItemType Directory -Force $candidate | Out-Null
          Copy-Item build/m4/windows-cmake/Release/ChatClient.exe "$candidate/ChatClient.exe"
          Copy-Item build/m4/windows-cmake/Release/ChatRoomUpdateLauncher.exe `
            "$candidate/ChatRoomUpdateLauncher.exe"
          windeployqt --release --no-translations "$candidate/ChatClient.exe"
          $sodiumDll = Get-ChildItem "$env:SODIUM_ROOT/bin" -Filter "*sodium*.dll" | Select-Object -First 1
          if (-not $sodiumDll) { throw "CMake payload is missing the libsodium runtime source" }
          Copy-Item $sodiumDll.FullName "$candidate/$($sodiumDll.Name)"
          $evidence = "$env:GITHUB_WORKSPACE/build/m0/artifacts/windows/cmake-payload-parity.json"
          python tools/compare_windows_client_payloads.py `
            --baseline $baseline `
            --candidate $candidate `
            --version "${{ steps.product-version.outputs.version }}" `
            --source-revision "${{ github.sha }}" `
            --output $evidence
          if ($LASTEXITCODE -ne 0) { throw "CMake/qmake payload parity failed" }

      - name: Build forwarding-enabled Windows candidate gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S . -B build/m6/windows-forwarding-gate -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCHATROOM_BUILD_HEADLESS_SERVER=ON `
            -DCHATROOM_BUILD_WINDOWS_CLIENT=ON `
            -DCHATROOM_ENABLE_WINDOWS_V2_PREVIEW=ON `
            -DCHATROOM_ENABLE_WINDOWS_V2_FORWARDING=ON `
            -DCHATROOM_WINDOWS_V2_WSS_URL=wss://preview-chat.example.test/v2/windows `
            -DCHATROOM_WINDOWS_V2_FALLBACK_WSS_URL=wss://preview-chat-secondary.example.test/v2/windows `
            -DBUILD_TESTING=ON `
            "-DSODIUM_ROOT=$env:SODIUM_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Forwarding Windows configuration failed" }
          cmake --build build/m6/windows-forwarding-gate --config Release `
            --target ChatClient V2WindowsDeviceManagementTransportTest `
              V2WindowsForwardTargetDialogTest `
              WindowsV2ConfigurationDiagnosticTest --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Forwarding Windows build failed" }
          ctest --test-dir build/m6/windows-forwarding-gate -C Release `
            -R "^m6_windows_v2_(device_management_transport|forward_target_dialog)$" `
            --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Forwarding Windows transport/Widgets gate failed" }
          $client = Get-Item build/m6/windows-forwarding-gate/Release/ChatClient.exe
          $v2 = (& $client.FullName --chatroom-print-v2-configuration-json) |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $v2.schemaVersion -ne 2 `
              -or $v2.enabled -ne $true -or $v2.messageForwardingEnabled -ne $true `
              -or $v2.endpoint -ne "wss://preview-chat.example.test/v2/windows" `
              -or $v2.fallbackEndpoints.Count -ne 1 `
              -or $v2.fallbackEndpoints[0] -ne "wss://preview-chat-secondary.example.test/v2/windows") {
            throw "Forwarding Windows binary configuration evidence failed"
          }

      - name: Install pinned NSIS compiler
        shell: pwsh
        run: choco install nsis --version="$env:NSIS_VERSION" --yes --no-progress

      - name: Exercise the CMake Windows verification installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS/makensis.exe"
          tools/verify_windows_cmake_installer.ps1 `
            -PayloadDirectory build/m4/windows-cmake-payload `
            -Version "${{ steps.product-version.outputs.version }}" `
            -SourceRevision "${{ github.sha }}" `
            -MakensisPath $makensis `
            -InstallerScript packaging/windows/ChatRoom.nsi `
            -IconFile Client/resources/app_icon.ico `
            -WorkRoot "$env:RUNNER_TEMP/ChatRoomCMakeInstallerGate"

      - name: Promote verified CMake payload as canonical input
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidate = (Resolve-Path "build/m4/windows-cmake-payload").Path
          $canonical = "$env:GITHUB_WORKSPACE/build/m0/artifacts/windows/client"
          if (Test-Path $canonical) { Remove-Item $canonical -Recurse -Force }
          New-Item -ItemType Directory -Force $canonical | Out-Null
          Get-ChildItem $candidate -Force | Copy-Item -Destination $canonical -Recurse
          python tools/compare_windows_client_payloads.py `
            --baseline $candidate `
            --candidate $canonical `
            --baseline-build-system cmake `
            --candidate-build-system cmake `
            --require-executable-byte-equality `
            --version "${{ steps.product-version.outputs.version }}" `
            --source-revision "${{ github.sha }}" `
            --output "$env:RUNNER_TEMP/cmake-canonical-copy-evidence.json"
          if ($LASTEXITCODE -ne 0) { throw "Canonical CMake payload copy changed bytes" }

      - name: Compile and exercise unsigned Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifact = (Resolve-Path "build/m0/artifacts/windows").Path
          $payload = (Resolve-Path "$artifact/client").Path
          $icon = (Resolve-Path "Client/resources/app_icon.ico").Path
          $version = "${{ steps.product-version.outputs.version }}"
          $installerDirectory = "$artifact/installer"
          New-Item -ItemType Directory -Force $installerDirectory | Out-Null
          $installerDirectory = (Resolve-Path $installerDirectory).Path
          $priorInstallerDirectory = "$env:RUNNER_TEMP/ChatRoomPriorInstaller"
          New-Item -ItemType Directory -Force $priorInstallerDirectory | Out-Null
          $priorInstallerDirectory = (Resolve-Path $priorInstallerDirectory).Path
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS/makensis.exe"
          if (-not (Test-Path $makensis -PathType Leaf)) { throw "Pinned NSIS compiler was not found" }

          $priorVersion = "0.9.0"
          & $makensis /WX /NOCONFIG /V2 "/DVERSION=$priorVersion" `
            "/DSOURCE_REVISION=0000000000000000000000000000000000000000" `
            "/DPAYLOAD_DIR=$payload" "/DOUTPUT_DIR=$priorInstallerDirectory" "/DICON_FILE=$icon" `
            packaging/windows/ChatRoom.nsi
          if ($LASTEXITCODE -ne 0) { throw "Prior NSIS compilation failed with exit code $LASTEXITCODE" }

          & $makensis /WX /NOCONFIG /V2 "/DVERSION=$version" "/DSOURCE_REVISION=${{ github.sha }}" `
            "/DPAYLOAD_DIR=$payload" "/DOUTPUT_DIR=$installerDirectory" "/DICON_FILE=$icon" `
            packaging/windows/ChatRoom.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS compilation failed with exit code $LASTEXITCODE" }

          $installer = "$installerDirectory/ChatRoom-$version-unsigned-verification-Setup.exe"
          if (-not (Test-Path $installer -PathType Leaf)) { throw "Unsigned Setup.exe was not created" }
          if ((Get-AuthenticodeSignature $installer).Status -ne "NotSigned") {
            throw "Verification installer must remain explicitly unsigned"
          }

          $unsignedReleaseName = "$env:RUNNER_TEMP/ChatRoom-$version-Setup.exe"
          $unsignedUninstallerName = "$env:RUNNER_TEMP/ChatRoom-$version-Uninstall.exe"
          $unsignedSignatureEvidence = "$env:RUNNER_TEMP/windows-release-signatures.json"
          Copy-Item $installer $unsignedReleaseName
          Copy-Item $installer $unsignedUninstallerName
          try {
            $signatureRejected = $false
            try {
              & tools/verify_windows_release_signatures.ps1 `
                -ClientPath "$payload/ChatClient.exe" `
                -LauncherPath "$payload/ChatRoomUpdateLauncher.exe" `
                -UninstallerPath $unsignedUninstallerName `
                -InstallerPath $unsignedReleaseName `
                -Version $version `
                -SourceRevision "${{ github.sha }}" `
                -ExpectedSignerSha256 ("0" * 64) `
                -EvidencePath $unsignedSignatureEvidence
            } catch {
              $signatureRejected = $true
            }
            if (-not $signatureRejected) {
              throw "Unsigned verification artifacts unexpectedly passed release signature policy"
            }
            if (Test-Path $unsignedSignatureEvidence) {
              throw "Unsigned release-signature rejection created evidence"
            }
          } finally {
            Remove-Item $unsignedReleaseName,$unsignedUninstallerName,$unsignedSignatureEvidence -Force -ErrorAction SilentlyContinue
          }

          $installRoot = "$env:RUNNER_TEMP/ChatRoomInstall"
          if ($installRoot.Contains(" ")) { throw "Silent verification install path must not contain spaces" }
          $priorInstaller = "$priorInstallerDirectory/ChatRoom-$priorVersion-unsigned-verification-Setup.exe"
          $priorInstall = Start-Process -FilePath $priorInstaller -ArgumentList @("/S", "/D=$installRoot") -Wait -PassThru
          if ($priorInstall.ExitCode -ne 0) { throw "Prior silent install failed with exit code $($priorInstall.ExitCode)" }
          $priorRegistration = Get-ItemProperty "HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/ChatRoom"
          if ($priorRegistration.DisplayVersion -ne $priorVersion) { throw "Prior installer version was not registered" }

          $oldProgramSentinel = "$installRoot/.m4-old-program-sentinel"
          Set-Content -Path $oldProgramSentinel -Value "must-be-replaced"
          $sentinelDirectory = "$env:APPDATA/QtChatRoom/ChatClient"
          New-Item -ItemType Directory -Force $sentinelDirectory | Out-Null
          $sentinel = "$sentinelDirectory/.m4-installer-verification"
          Set-Content -Path $sentinel -Value "preserve"

          $upgrade = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$installRoot") -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "Silent upgrade failed with exit code $($upgrade.ExitCode)" }
          if (Test-Path $oldProgramSentinel) { throw "Upgrade retained a stale program file" }
          if ((Test-Path "$installRoot.__chatroom_stage") -or (Test-Path "$installRoot.__chatroom_backup")) {
            throw "Upgrade left a staging or backup directory behind"
          }
          if (-not (Test-Path $sentinel -PathType Leaf)) { throw "Upgrade deleted account-local client data" }
          $installedClient = "$installRoot/ChatClient.exe"
          $installedLauncher = "$installRoot/ChatRoomUpdateLauncher.exe"
          if (-not (Test-Path $installedClient -PathType Leaf)) { throw "Installed client executable is missing" }
          if (-not (Test-Path $installedLauncher -PathType Leaf)) { throw "Installed update launcher is missing" }
          if (-not (Test-Path "$installRoot/sqldrivers/qsqlite.dll" -PathType Leaf)) {
            throw "Installed client is missing the Qt SQLite driver"
          }
          if (-not (Get-ChildItem $installRoot -Filter "*sodium*.dll" -ErrorAction SilentlyContinue)) {
            throw "Installed client is missing the update-verifier libsodium runtime"
          }
          if (-not (Get-Item $installedClient).VersionInfo.ProductVersion.StartsWith($version)) {
            throw "Installed client version does not match canonical VERSION"
          }

          $launcherFixture = "$env:RUNNER_TEMP/ChatRoomUnsignedLauncherFixture.exe"
          Copy-Item $installer $launcherFixture
          $launcherFixtureSize = (Get-Item $launcherFixture).Length
          $launcherFixtureSha = (Get-FileHash $launcherFixture -Algorithm SHA256).Hash.ToLowerInvariant()
          $launcherRequestId = [guid]::NewGuid().ToString("D").ToLowerInvariant()
          $launcherResult = "$env:RUNNER_TEMP/result-$launcherRequestId.json"
          $launcherEventName = "Local\ChatRoom.UpdateLauncher.Ready.$launcherRequestId"
          $launcherCommitEventName = "Local\ChatRoom.UpdateLauncher.Commit.$launcherRequestId"
          $launcherReady = [System.Threading.EventWaitHandle]::new(
            $false, [System.Threading.EventResetMode]::AutoReset, $launcherEventName)
          $launcherCommit = [System.Threading.EventWaitHandle]::new(
            $false, [System.Threading.EventResetMode]::AutoReset, $launcherCommitEventName)
          $launcherParent = Start-Process powershell -ArgumentList @(
            "-NoProfile", "-Command", "Start-Sleep -Seconds 120") -PassThru
          try {
            $launcherProcess = Start-Process -FilePath $installedLauncher -ArgumentList @(
              "--parent-pid", "$($launcherParent.Id)",
              "--installer", $launcherFixture,
              "--installer-size", "$launcherFixtureSize",
              "--installer-sha256", $launcherFixtureSha,
              "--signer-thumbprint-sha256", ("0" * 64),
              "--restart-executable", $installedClient,
              "--result-file", $launcherResult,
              "--request-id", $launcherRequestId,
              "--ready-event", $launcherEventName,
              "--commit-event", $launcherCommitEventName) -PassThru
            if (-not $launcherReady.WaitOne([TimeSpan]::FromSeconds(15))) {
              throw "Update launcher did not complete its parent-process handshake"
            }
            $launcherCommit.Set() | Out-Null
            Stop-Process -Id $launcherParent.Id
            $launcherParent.WaitForExit()
            if (-not $launcherProcess.WaitForExit(30000)) {
              throw "Update launcher did not finish unsigned rejection"
            }
            if ($launcherProcess.ExitCode -ne 4) {
              throw "Unsigned launcher fixture returned $($launcherProcess.ExitCode) instead of 4"
            }
            $launcherEvidence = Get-Content $launcherResult -Raw | ConvertFrom-Json
            if ($launcherEvidence.requestId -ne $launcherRequestId `
                -or $launcherEvidence.outcome -ne "trust-rejected" `
                -or (Test-Path $launcherFixture)) {
              throw "Update launcher did not atomically reject and clean the unsigned fixture"
            }
          } finally {
            $launcherReady.Dispose()
            $launcherCommit.Dispose()
            if (-not $launcherParent.HasExited) { Stop-Process -Id $launcherParent.Id -Force }
            if ($launcherProcess -and -not $launcherProcess.HasExited) {
              Stop-Process -Id $launcherProcess.Id -Force
            }
            Remove-Item $launcherFixture,$launcherResult -Force -ErrorAction SilentlyContinue
          }
          $uninstallKey = Get-ItemProperty "HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/ChatRoom"
          if ($uninstallKey.DisplayVersion -ne $version -or $uninstallKey.SourceRevision -ne "${{ github.sha }}" `
              -or $uninstallKey.InstallId -ne "chat-room-windows-client-v1") {
            throw "Installed Add/Remove Programs metadata is not traceable"
          }
          $installMarker = "$installRoot/.chat-room-install.ini"
          if (-not (Test-Path $installMarker -PathType Leaf)) { throw "Installed ownership marker is missing" }
          if (-not (Select-String -Path $installMarker -SimpleMatch "ProductId=chat-room-windows-client-v1" -Quiet)) {
            throw "Installed ownership marker is invalid"
          }

          $runningClient = Start-Process -FilePath $installedClient -PassThru
          Start-Sleep -Seconds 2
          if ($runningClient.HasExited) { throw "Installed client did not remain running for the upgrade-lock gate" }
          try {
            $blockedUpgrade = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$installRoot") -Wait -PassThru
            if ($blockedUpgrade.ExitCode -ne 4) {
              throw "Running-client upgrade returned $($blockedUpgrade.ExitCode) instead of 4"
            }
            if ($runningClient.HasExited -or -not (Test-Path $installedClient -PathType Leaf) `
                -or -not (Test-Path $sentinel -PathType Leaf)) {
              throw "Rejected running-client upgrade changed the process, installation, or account data"
            }
          } finally {
            if (-not $runningClient.HasExited) { Stop-Process -Id $runningClient.Id -Force }
            $runningClient.WaitForExit()
          }

          $downgrade = Start-Process -FilePath $priorInstaller -ArgumentList @("/S", "/D=$installRoot") -Wait -PassThru
          if ($downgrade.ExitCode -eq 0) { throw "Older installer was allowed to downgrade the current version" }
          $afterDowngrade = Get-ItemProperty "HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/ChatRoom"
          if ($afterDowngrade.DisplayVersion -ne $version -or -not (Test-Path $installedClient -PathType Leaf) `
              -or -not (Test-Path $sentinel -PathType Leaf)) {
            throw "Rejected downgrade changed the current installation or account data"
          }

          $uninstall = Start-Process -FilePath "$installRoot/Uninstall.exe" -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstall.ExitCode)" }
          for ($attempt = 0; $attempt -lt 20 -and (Test-Path $installRoot); $attempt++) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path $installRoot) { throw "Uninstall left the application directory behind" }
          if (-not (Test-Path $sentinel -PathType Leaf)) { throw "Uninstall deleted account-local client data" }
          if (Test-Path "HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/ChatRoom") {
            throw "Uninstall registration was not removed"
          }
          Remove-Item $sentinel -Force

      - name: Generate Windows artifact integrity manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifact = "build/m0/artifacts/windows"
          $version = "${{ steps.product-version.outputs.version }}"
          python tools/windows_artifact_manifest.py `
            --payload-root "$artifact/client" `
            --version-file VERSION `
            --source-revision "${{ github.sha }}" `
            --qt-version "${{ env.QT_VERSION }}" `
            --installer "$artifact/installer/ChatRoom-$version-unsigned-verification-Setup.exe" `
            --cmake-payload-parity "$artifact/cmake-payload-parity.json" `
            --build-system cmake `
            --output-dir "$artifact"

      - name: Upload unsigned Windows verification artifact
        uses: actions/upload-artifact@v7
        with:
          name: chat-room-windows-client-${{ steps.product-version.outputs.version }}-unsigned-verification-${{ github.sha }}
          path: build/m0/artifacts/windows
          if-no-files-found: error
          retention-days: 14
