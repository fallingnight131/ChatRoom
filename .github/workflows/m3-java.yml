name: Java V2 Baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            Backend/*.gradle.kts
            Backend/gradle/libs.versions.toml
            Backend/**/build.gradle.kts

      - name: Set up Node.js 22 for TypeScript bindings
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Backend/protocol-v2/typescript/package-lock.json

      - name: Install Qt Windows-adapter portability dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes qt6-base-dev qt6-websockets-dev

      - name: Verify Java workspace, PostgreSQL migrations, and client bindings
        run: python3 tools/verify_m0.py --java --postgres --protocol-bindings

      - name: Record disposable Java V2 PostgreSQL performance evidence
        run: |
          python3 -m unittest \
            Tests/java_performance_result_test.py \
            Tests/java_gateway_performance_result_test.py
          python3 tools/verify_m0.py --java-performance \
            --java-performance-output build/m5/java-v2-postgres-performance.json
          python3 tools/java_performance_result.py \
            build/m5/java-v2-postgres-performance.json \
            --source-revision "${{ github.sha }}" \
            --require-clean
          python3 tools/verify_m0.py --java-gateway-performance \
            --java-gateway-performance-output build/m5/java-v2-gateway-performance.json
          python3 tools/java_gateway_performance_result.py \
            build/m5/java-v2-gateway-performance.json \
            --source-revision "${{ github.sha }}" \
            --require-clean
          python3 tools/verify_m0.py --java-gateway-performance \
            --java-gateway-performance-receivers 4 \
            --java-gateway-performance-reconnect-rounds 2 \
            --java-gateway-performance-warmup 2 \
            --java-gateway-performance-messages 20 \
            --java-gateway-performance-output build/m5/java-v2-gateway-reconnect-performance.json
          python3 tools/java_gateway_performance_result.py \
            build/m5/java-v2-gateway-reconnect-performance.json \
            --source-revision "${{ github.sha }}" \
            --require-clean
          python3 tools/verify_m0.py --java-gateway-performance \
            --java-gateway-performance-receivers 2 \
            --java-gateway-performance-warmup 1 \
            --java-gateway-performance-messages 2 \
            --java-gateway-performance-payload-bytes 65536 \
            --java-gateway-performance-slow-consumer-max-messages 100 \
            --java-gateway-performance-output build/m5/java-v2-gateway-slow-consumer-performance.json
          python3 tools/java_gateway_performance_result.py \
            build/m5/java-v2-gateway-slow-consumer-performance.json \
            --source-revision "${{ github.sha }}" \
            --require-clean
          python3 tools/verify_m0.py --java-gateway-performance \
            --java-gateway-performance-receivers 1 \
            --java-gateway-performance-warmup 1 \
            --java-gateway-performance-messages 2 \
            --java-gateway-performance-payload-bytes 64 \
            --java-gateway-performance-postgres-saturation-senders 4 \
            --java-gateway-performance-output build/m5/java-v2-gateway-postgres-saturation-performance.json
          python3 tools/java_gateway_performance_result.py \
            build/m5/java-v2-gateway-postgres-saturation-performance.json \
            --source-revision "${{ github.sha }}" \
            --require-clean
          python3 tools/verify_m0.py --java-gateway-performance \
            --java-gateway-performance-receivers 1 \
            --java-gateway-performance-warmup 1 \
            --java-gateway-performance-messages 2 \
            --java-gateway-performance-payload-bytes 64 \
            --java-gateway-performance-postgres-outage \
            --java-gateway-performance-output build/m5/java-v2-gateway-postgres-outage-performance.json
          python3 tools/java_gateway_performance_result.py \
            build/m5/java-v2-gateway-postgres-outage-performance.json \
            --source-revision "${{ github.sha }}" \
            --require-clean

      - name: Upload non-capacity Java performance evidence
        uses: actions/upload-artifact@v6
        with:
          name: java-v2-performance-${{ github.sha }}
          path: |
            build/m5/java-v2-postgres-performance.json
            build/m5/java-v2-gateway-performance.json
            build/m5/java-v2-gateway-reconnect-performance.json
            build/m5/java-v2-gateway-slow-consumer-performance.json
            build/m5/java-v2-gateway-postgres-saturation-performance.json
            build/m5/java-v2-gateway-postgres-outage-performance.json
          if-no-files-found: error
          retention-days: 14
