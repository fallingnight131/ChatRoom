name: M0 Baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  inventory-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: WebClient/package-lock.json

      - name: Verify source inventory and web build
        run: python3 tools/verify_m0.py --web

      - name: Install pinned browser engines
        working-directory: WebClient
        run: npx playwright install --with-deps chromium firefox

      - name: Verify Chromium and Firefox Web compatibility
        working-directory: WebClient
        run: npm run test:browser

      - name: Upload browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: web-browser-failure-${{ github.sha }}
          path: |
            WebClient/playwright-report
            WebClient/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify Windows release trust policies
        run: |
          python3 Tests/windows_update_manifest_test.py
          python3 Tests/windows_update_protected_signer_policy_test.py
          python3 Tests/windows_update_channel_candidate_test.py
          python3 Tests/windows_protected_update_workflow_test.py
          python3 Tests/windows_update_release_authorization_test.py
          python3 Tests/windows_update_channel_store_test.py
          python3 Tests/windows_update_release_execution_test.py
          python3 Tests/windows_update_release_probe_test.py
          python3 Tests/windows_update_release_completion_test.py
          python3 Tests/windows_update_release_rollback_test.py
          python3 Tests/windows_update_rollback_completion_test.py
          python3 Tests/windows_update_product_trust_intent_test.py
          python3 Tests/windows_release_signature_policy_test.py
          python3 Tests/windows_release_evidence_test.py
          python3 Tests/windows_release_candidate_test.py
          python3 Tests/windows_unsigned_artifact_verifier_test.py
          python3 Tests/windows_protected_release_intent_test.py
          python3 Tests/windows_release_installer_mode_test.py
          python3 Tests/windows_protected_signing_workflow_test.py
          python3 Tests/windows_uninstaller_export_test.py
          python3 Tests/windows_install_evidence_test.py
          python3 Tests/windows_signed_install_policy_test.py

      - name: Test Web artifact manifest policy
        run: |
          python3 Tests/web_artifact_manifest_test.py
          python3 Tests/web_release_store_test.py
          python3 Tests/web_release_probe_test.py
          python3 Tests/web_rollback_evidence_test.py
          python3 Tests/web_application_route_probe_test.py
          python3 Tests/web_promotion_evidence_test.py
          python3 Tests/web_release_authorization_test.py
          python3 Tests/web_release_execution_test.py
          python3 Tests/web_release_completion_test.py
          python3 Tests/web_release_rollback_execution_test.py

      - name: Assemble undeployed Web verification artifact
        id: web-version
        shell: bash
        run: |
          set -euo pipefail
          artifact="build/m0/artifacts/web"
          mkdir -p "$artifact"
          cp -R WebClient/dist "$artifact/site"
          cp packaging/web/response-policy.json "$artifact/response-policy.json"
          python3 tools/web_artifact_manifest.py \
            --site-root "$artifact/site" \
            --package-json WebClient/package.json \
            --source-revision "${{ github.sha }}" \
            --response-policy "$artifact/response-policy.json" \
            --output-dir "$artifact"
          version=$(node -p 'require("./WebClient/package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload undeployed Web verification artifact
        uses: actions/upload-artifact@v6
        with:
          name: chat-room-web-${{ steps.web-version.outputs.version }}-not-deployed-verification-${{ github.sha }}
          path: build/m0/artifacts/web
          if-no-files-found: error
          retention-days: 14

  database-and-v1-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install headless Qt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes qt6-base-dev libqt6sql6-sqlite qt6-websockets-dev libsodium-dev pkg-config

      - name: Set up Java 21 for the migration CLI
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            Backend/*.gradle.kts
            Backend/gradle/libs.versions.toml
            Backend/**/build.gradle.kts

      - name: Verify clean and restarted SQLite schemas
        run: python3 tools/verify_m0.py --db-schema

      - name: Verify Argon2id and legacy password migration
        run: python3 tools/verify_m0.py --password-hash

      - name: Verify CMake headless server path
        run: python3 tools/verify_m0.py --cmake-headless

      - name: Verify critical V1 TCP flows
        run: python3 tools/verify_m0.py --v1-smoke

      - name: Rehearse V1 identity backup and restore
        run: python3 tools/verify_m0.py --v1-identity-restore

      - name: Archive V1 identity restore evidence
        uses: actions/upload-artifact@v6
        with:
          name: v1-identity-restore-evidence-linux
          path: build/m0/linux/v1-identity-restore-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify reproducible V1 performance scenario
        run: >-
          python3 tools/verify_m0.py --performance
          --performance-clients 4
          --performance-messages 40
          --performance-warmup 10
